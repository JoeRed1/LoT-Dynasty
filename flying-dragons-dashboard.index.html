<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Flying Dragons — Dynasty War Room</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,900&family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#0B1210; --panel:#111B18; --panel2:#0E1614; --line:#1E2E29; --line2:#2B403A;
  --parch:#E9E2D0; --muted:#87998F; --ember:#E0722F; --gold:#D9A441;
  --jade:#4FA98B; --crimson:#C7443A; --violet:#8C7BB8;
  --disp:'Fraunces',Georgia,serif; --body:'IBM Plex Sans',system-ui,sans-serif; --mono:'IBM Plex Mono',ui-monospace,monospace;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{background:var(--ink);color:var(--parch);font-family:var(--body);font-size:14px;line-height:1.5;
  background-image:radial-gradient(circle at 12% -10%, rgba(224,114,47,.10), transparent 55%),
                   radial-gradient(circle at 95% 0%, rgba(79,169,139,.07), transparent 45%);
  background-attachment:fixed;}
::-webkit-scrollbar{width:10px;height:10px}
::-webkit-scrollbar-thumb{background:var(--line2);border-radius:6px}
::-webkit-scrollbar-track{background:transparent}

/* ---------- shell ---------- */
.shell{display:flex;min-height:100vh}
.rail{width:210px;flex:0 0 210px;border-right:1px solid var(--line);padding:22px 0 40px;position:sticky;top:0;height:100vh;overflow-y:auto;background:linear-gradient(180deg,rgba(17,27,24,.9),rgba(11,18,16,.4))}
.crest{padding:0 20px 20px;border-bottom:1px solid var(--line);margin-bottom:14px}
.crest .mark{font-family:var(--disp);font-weight:900;font-size:25px;line-height:1.05;letter-spacing:-.02em}
.crest .mark em{font-style:italic;color:var(--ember)}
.crest .sub{font-family:var(--mono);font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:var(--muted);margin-top:7px}
.navbtn{display:flex;align-items:baseline;gap:10px;width:100%;background:none;border:0;border-left:2px solid transparent;color:var(--muted);
  font-family:var(--body);font-size:13.5px;text-align:left;padding:9px 20px;cursor:pointer;transition:.15s}
.navbtn .idx{font-family:var(--mono);font-size:10px;opacity:.55}
.navbtn:hover{color:var(--parch);background:rgba(255,255,255,.03)}
.navbtn.on{color:var(--parch);border-left-color:var(--ember);background:rgba(224,114,47,.09)}
.railfoot{padding:18px 20px 0;margin-top:18px;border-top:1px solid var(--line);font-family:var(--mono);font-size:10px;color:var(--muted);line-height:1.7}

.main{flex:1;min-width:0;padding:26px 30px 70px;max-width:1360px}
.pagehead{display:flex;justify-content:space-between;align-items:flex-end;gap:20px;flex-wrap:wrap;margin-bottom:22px;padding-bottom:14px;border-bottom:1px solid var(--line)}
h1{font-family:var(--disp);font-weight:600;font-size:30px;margin:0;letter-spacing:-.01em}
.pagehead p{margin:6px 0 0;color:var(--muted);max-width:62ch;font-size:13px}
.view{display:none} .view.on{display:block}

/* ---------- primitives ---------- */
.grid{display:grid;gap:14px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:3px;padding:16px}
.card h3{margin:0 0 12px;font-family:var(--mono);font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:var(--muted);font-weight:500}
.stat{font-family:var(--disp);font-weight:600;font-size:31px;line-height:1;letter-spacing:-.02em}
.stat.sm{font-size:22px}
.statlabel{font-family:var(--mono);font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);margin-top:8px}
.delta{font-family:var(--mono);font-size:11px}
.up{color:var(--jade)} .down{color:var(--crimson)} .neut{color:var(--gold)}
.mono{font-family:var(--mono)}
.muted{color:var(--muted)}
.pill{display:inline-block;font-family:var(--mono);font-size:9.5px;letter-spacing:.1em;text-transform:uppercase;padding:2.5px 7px;border-radius:2px;border:1px solid var(--line2);color:var(--muted);white-space:nowrap}
.pill.core{border-color:rgba(79,169,139,.5);color:var(--jade);background:rgba(79,169,139,.09)}
.pill.hold{border-color:var(--line2);color:var(--muted)}
.pill.trade{border-color:rgba(217,164,65,.5);color:var(--gold);background:rgba(217,164,65,.09)}
.pill.cut{border-color:rgba(199,68,58,.5);color:var(--crimson);background:rgba(199,68,58,.09)}
.pill.risk{border-color:rgba(224,114,47,.55);color:var(--ember);background:rgba(224,114,47,.10)}
.pill.pos{border-color:var(--line2);color:var(--parch)}
.tag{font-family:var(--mono);font-size:9.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}

table{width:100%;border-collapse:collapse;font-size:13px}
th{font-family:var(--mono);font-size:9.5px;letter-spacing:.13em;text-transform:uppercase;color:var(--muted);text-align:left;
   font-weight:500;padding:8px 10px;border-bottom:1px solid var(--line2);cursor:pointer;user-select:none;white-space:nowrap;position:sticky;top:0;background:var(--panel);z-index:2}
th.num,td.num{text-align:right}
th:hover{color:var(--parch)}
th .arw{opacity:.6;font-size:8px}
td{padding:9px 10px;border-bottom:1px solid rgba(30,46,41,.7);vertical-align:top}
tbody tr:hover{background:rgba(255,255,255,.025)}
.tblwrap{max-height:none;overflow:auto;border:1px solid var(--line);border-radius:3px;background:var(--panel)}
.num{font-family:var(--mono);font-variant-numeric:tabular-nums}

input[type=text],select{background:var(--panel2);border:1px solid var(--line2);color:var(--parch);font-family:var(--body);
  font-size:13px;padding:7px 10px;border-radius:2px;outline:none}
input[type=text]:focus,select:focus{border-color:var(--ember)}
input[type=text]::placeholder{color:#5d6f68}
.controls{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:12px}
.chip{font-family:var(--mono);font-size:10px;letter-spacing:.1em;text-transform:uppercase;padding:6px 11px;border:1px solid var(--line2);
  background:transparent;color:var(--muted);border-radius:2px;cursor:pointer;transition:.15s}
.chip:hover{color:var(--parch);border-color:var(--muted)}
.chip.on{background:var(--ember);border-color:var(--ember);color:#160C05;font-weight:600}
button:focus-visible,.chip:focus-visible,.navbtn:focus-visible,select:focus-visible{outline:2px solid var(--gold);outline-offset:2px}

.bar{height:5px;background:var(--line);border-radius:3px;overflow:hidden}
.bar > i{display:block;height:100%;background:var(--ember);border-radius:3px}

/* ---------- war room ---------- */
.kpis{grid-template-columns:repeat(auto-fit,minmax(168px,1fr))}
.alertrow{display:flex;gap:11px;padding:10px 0;border-bottom:1px solid rgba(30,46,41,.7);align-items:flex-start}
.alertrow:last-child{border-bottom:0}
.alertrow .dot{width:6px;height:6px;border-radius:50%;margin-top:7px;flex:0 0 6px;background:var(--muted)}
.dot.hi{background:var(--crimson)} .dot.md{background:var(--gold)} .dot.lo{background:var(--muted)}
.alertrow .body{flex:1;min-width:0}
.alertrow .t{font-size:13px} .alertrow .d{font-size:12px;color:var(--muted);margin-top:2px}
.posrow{display:grid;grid-template-columns:42px 1fr 66px 52px;gap:10px;align-items:center;padding:7px 0}
.posrow .nm{font-family:var(--mono);font-size:11px;letter-spacing:.08em}
.rankbadge{font-family:var(--mono);font-size:10.5px;text-align:right}

/* ---------- trade lab ---------- */
.lab{display:grid;grid-template-columns:1fr 300px 1fr;gap:14px;align-items:start}
@media(max-width:1080px){.lab{grid-template-columns:1fr}}
.assetlist{max-height:420px;overflow-y:auto;margin:-4px -6px 0;padding:4px 6px}
.asset{display:flex;justify-content:space-between;gap:8px;align-items:center;padding:6px 8px;border:1px solid transparent;border-radius:2px;cursor:pointer;font-size:12.5px}
.asset:hover{background:rgba(255,255,255,.04)}
.asset.sel{background:rgba(224,114,47,.13);border-color:rgba(224,114,47,.5)}
.asset .l{display:flex;gap:7px;align-items:center;min-width:0}
.asset .nm{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.asset .v{font-family:var(--mono);font-size:11.5px;color:var(--muted);white-space:nowrap}
.asset.sel .v{color:var(--ember)}
.scale{padding:8px 0 4px;text-align:center}
.verdict{font-family:var(--disp);font-weight:600;font-size:26px;letter-spacing:-.01em;margin-top:6px}
.readout{font-family:var(--mono);font-size:11.5px;color:var(--muted);margin-top:6px;line-height:1.8}
.notes{margin-top:12px;border-top:1px solid var(--line);padding-top:10px;font-size:12.5px}
.notes div{margin-bottom:7px;padding-left:11px;border-left:2px solid var(--line2)}
.notes div.g{border-left-color:var(--jade)} .notes div.r{border-left-color:var(--crimson)} .notes div.y{border-left-color:var(--gold)}

.teamrow{display:grid;grid-template-columns:26px 1fr 84px 90px;gap:10px;align-items:center;padding:9px 8px;border-bottom:1px solid rgba(30,46,41,.7);cursor:pointer}
.teamrow:hover{background:rgba(255,255,255,.03)}
.teamrow.me{background:rgba(224,114,47,.08)}
.teamrow .rk{font-family:var(--mono);font-size:11px;color:var(--muted)}
.teamrow .tn{font-size:13.5px} .teamrow .on{font-size:11px;color:var(--muted)}

.pickgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(128px,1fr));gap:9px}
.pick{border:1px solid var(--line2);border-radius:2px;padding:10px;background:var(--panel2)}
.pick.own{border-color:rgba(79,169,139,.55);background:rgba(79,169,139,.07)}
.pick.gone{opacity:.45}
.pick .s{font-family:var(--mono);font-size:10px;letter-spacing:.12em;color:var(--muted)}
.pick .r{font-family:var(--disp);font-size:19px;font-weight:600;margin:3px 0}
.pick .v{font-family:var(--mono);font-size:11px;color:var(--gold)}
.pick .o{font-size:11px;color:var(--muted);margin-top:4px}

details.det{border-top:1px solid rgba(30,46,41,.7)}
details.det summary{cursor:pointer;padding:9px 4px;font-size:13px;list-style:none;display:flex;justify-content:space-between;gap:10px}
details.det summary::-webkit-details-marker{display:none}
details.det summary:hover{color:var(--gold)}
details.det .inner{padding:0 4px 12px;font-size:12.5px;color:var(--muted)}
.empty{padding:26px;text-align:center;color:var(--muted);font-size:13px}
@media(max-width:800px){
  .shell{flex-direction:column}
  .rail{position:static;width:100%;height:auto;flex:none;display:flex;flex-wrap:wrap;gap:2px;padding:16px 0 10px;border-right:0;border-bottom:1px solid var(--line)}
  .crest{width:100%;border-bottom:0;padding-bottom:12px;margin-bottom:6px}
  .navbtn{width:auto;border-left:0;border-bottom:2px solid transparent;padding:7px 13px}
  .navbtn.on{border-left:0;border-bottom-color:var(--ember)}
  .railfoot{display:none}
  .main{padding:20px 16px 60px}
  .lab{grid-template-columns:1fr}
}
@media(prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>

  const picks = DATA.picks.filter(p => p.current_owner_roster_id === rid).map(p => ({

    value: pickValue(p.season, p.round), season: p.season, round: p.round, orig: p.original_roster_id
  }));
  return { players, picks, all: players.concat(picks) };
}
const assetsCache = {}; DATA.teams.forEach(t => assetsCache[t.roster_id] = teamAssets(t.roster_id));

  const roster = a.players.reduce((s, p) => s + p.value, 0);
  const capital = a.picks.reduce((s, p) => s + p.value, 0);
  return { ...t, roster, capital, total: roster + capital, byPos, count: a.players.length, picks: a.picks.length };
}).sort((a, b) => b.total - a.total);

function warRoom() {
  const alerts = [];
  MYPLAYERS.forEach(p => {
    if (p.injury) alerts.push({ w: 3, t: p.name + ' — ' + p.injury, d: p.note || (p.rawPos + ', ' + (p.team || 'FA')) });
    else if (p.status === 'injury_risk' || p.status === 'role_risk') alerts.push({ w: 2, t: p.name + ' — ' + STATUS_META[p.status][1], d: p.note });
    else if (p.status === 'cut_candidate') alerts.push({ w: 1, t: p.name + ' — cut candidate', d: p.note });
  });
  alerts.sort((a, b) => b.w - a.w);
  const acts = DATA.activity.filter(a => a.relevance === 'actionable');
  const feed = [...DATA.activity].sort((a, b) => String(b.occurred_at).localeCompare(String(a.occurred_at)));

  const posBars = POS_ORDER.map(p => {

      '<span class="rankbadge" style="color:' + col + '">' + ord(r.rank) + '</span></div>';

    kpi(fmt(MYT.total), 'Total franchise value', ord(MYT.rank) + ' of ' + DATA.teams.length + ' in the league', MYT.rank <= 4 ? 'up' : MYT.rank <= 8 ? 'neut' : 'down') +
    kpi(fmt(MYT.roster), 'Roster value', MYT.count + ' players held', 'neut') +
    kpi(fmt(MYT.capital), 'Draft capital', MYT.picks + ' picks owned', 'neut') +
    kpi('$' + MY.faab_remaining, 'FAAB remaining', Math.round(MY.faab_remaining / MY.faab_total * 100) + '% of budget left', MY.faab_remaining > 200 ? 'up' : 'neut') +
    kpi(String(alerts.filter(a => a.w === 3).length), 'Live injury flags', alerts.length + ' total roster flags', alerts.filter(a => a.w === 3).length ? 'down' : 'up') +
    '</div>' +
    '<div class="grid" style="grid-template-columns:1fr 1fr;align-items:start">' +
    '<div class="card"><h3>Needs a decision</h3>' + (alerts.length ? alerts.slice(0, 9).map(a =>
      '<div class="alertrow"><span class="dot ' + (a.w === 3 ? 'hi' : a.w === 2 ? 'md' : 'lo') + '"></span>' +
      '<div class="body"><div class="t">' + esc(a.t) + '</div><div class="d">' + esc(a.d) + '</div></div></div>').join('')
      : '<div class="empty">No flags on the roster. Enjoy it while it lasts.</div>') + '</div>' +
    '<div class="card"><h3>Positional strength · bar is share of league best</h3>' + posBars +
    '<div class="muted" style="font-size:11.5px;margin-top:12px;border-top:1px solid var(--line);padding-top:10px">' +
    'Thinnest group: <span style="color:var(--crimson)">' + POS_ORDER.slice().sort((a, b) => posRank[b].rank - posRank[a].rank)[0] +
    '</span> · Deepest: <span style="color:var(--jade)">' + POS_ORDER.slice().sort((a, b) => posRank[a].rank - posRank[b].rank)[0] + '</span></div></div>' +
    '</div>' +
    '<div class="grid" style="grid-template-columns:1fr 1fr;align-items:start;margin-top:14px">' +
    '<div class="card"><h3>Open items · ' + acts.length + ' actionable</h3>' +
    (acts.length ? acts.map(a => '<details class="det"><summary><span>' + esc(a.headline) + '</span><span class="tag">' + esc(a.event_type) + '</span></summary><div class="inner">' + esc(a.detail) + '</div></details>').join('') : '<div class="empty">Nothing outstanding.</div>') +

}

/* ================= 02 roster ================= */
function rosterView() {
  const s = state.roster;
  let rows = MYPLAYERS.filter(p =>
    (s.pos === 'ALL' || (s.pos === 'IDP' ? grp(p.pos) === 'IDP' : p.pos === s.pos)) &&

    (!s.q || (p.name + ' ' + (p.team || '') + ' ' + (p.note || '')).toLowerCase().includes(s.q.toLowerCase())));
  rows.sort((a, b) => {
    const A = a[s.sort], B = b[s.sort];

    ).join('') : '<tr><td colspan="7" class="empty">No players match those filters.</td></tr>') +

/* ================= 03 trade lab ================= */
function tradeLab() {
  const t = state.trade;
  const mine = assetsCache[ME].all.slice().sort((a, b) => b.value - a.value);
  const theirs = assetsCache[t.cp].all.slice().sort((a, b) => b.value - a.value);
  const give = mine.filter(a => t.give.has(a.key)), get = theirs.filter(a => t.get.has(a.key));
  const gv = give.reduce((s, a) => s + a.value, 0), rv = get.reduce((s, a) => s + a.value, 0);
  const delta = rv - gv, pct = gv ? delta / gv : (rv ? 1 : 0);
  const live = give.length || get.length;

  let verdict = 'Build a package', vcol = 'var(--muted)';
  if (live) {
    if (pct >= .15) { verdict = 'Clear win'; vcol = 'var(--jade)'; }
    else if (pct >= .04) { verdict = 'Accept'; vcol = 'var(--jade)'; }
    else if (pct >= -.05) { verdict = 'Fair — decide on fit'; vcol = 'var(--gold)'; }
    else if (pct >= -.15) { verdict = 'Overpay'; vcol = 'var(--ember)'; }
    else { verdict = 'Decline'; vcol = 'var(--crimson)'; }
  }
  const tilt = live ? Math.max(-14, Math.min(14, (pct || 0) * 45)) : 0;

  // fit notes
  const notes = [];
  if (live) {
    const idpIn = get.filter(a => a.kind === 'player' && grp(a.pos) === 'IDP').length;
    const idpOut = give.filter(a => a.kind === 'player' && grp(a.pos) === 'IDP').length;
    notes.push({ c: delta >= 0 ? 'g' : 'r', t: delta >= 0 ? 'Value surplus' : 'Value deficit', d: 'You receive ' + fmt(rv) + ' against ' + fmt(gv) + ' given — ' + (delta >= 0 ? '+' : '') + fmt(delta) + ' (' + (pct * 100).toFixed(1) + '%).' });
    const thin = POS_ORDER.slice().sort((a, b) => posRank[b].rank - posRank[a].rank)[0];
    if (idpIn > idpOut) notes.push({ c: 'g', t: 'Feeds the thin side', d: 'Nets ' + (idpIn - idpOut) + ' IDP piece(s). Your weakest group by league rank is ' + thin + ' (' + ord(posRank[thin].rank) + ').' });
    if (idpOut > idpIn) notes.push({ c: 'y', t: 'Costs IDP depth', d: 'Sends out ' + (idpOut - idpIn) + ' more IDP piece(s) than it brings back — check the starting requirement before firing.' });
    const flagged = give.filter(a => { const p = MYPLAYERS.find(m => m.name === a.name); return p && ['cut_candidate', 'trade_candidate', 'injury_risk', 'role_risk'].includes(p.status); });
    if (flagged.length) notes.push({ c: 'g', t: 'Moves flagged risk', d: 'Sends ' + flagged.map(f => f.name).join(', ') + ' — already tagged as risk or trade bait on your board.' });
    const core = give.filter(a => { const p = MYPLAYERS.find(m => m.name === a.name); return p && p.status === 'core_hold'; });
    if (core.length) notes.push({ c: 'r', t: 'Breaks a core hold', d: 'Includes ' + core.map(f => f.name).join(', ') + ', tagged core hold. Value alone should not carry this one.' });
    const pkIn = get.filter(a => a.kind === 'pick').length, pkOut = give.filter(a => a.kind === 'pick').length;
    if (pkIn > pkOut) notes.push({ c: 'y', t: 'Buys future, not now', d: 'Nets ' + (pkIn - pkOut) + ' pick(s). Fine if rebuilding, a cost if this is a win-now season.' });
    if (pkOut > pkIn) notes.push({ c: 'y', t: 'Spends draft capital', d: 'Nets out ' + (pkOut - pkIn) + ' pick(s). You hold ' + MYT.picks + ' picks worth ' + fmt(MYT.capital) + ' before this deal.' });
    if (get.length > give.length + 1) notes.push({ c: 'y', t: 'Roster crunch', d: 'Taking back ' + get.length + ' for ' + give.length + ' — you will need ' + (get.length - give.length) + ' open spot(s).' });
  }

  const list = (arr, side, q) => '<div class="assetlist">' + arr.filter(a => !q || a.name.toLowerCase().includes(q.toLowerCase())).map(a =>
    '<div class="asset' + ((side === 'A' ? t.give : t.get).has(a.key) ? ' sel' : '') + '" data-side="' + side + '" data-key="' + a.key + '">' +
    '<span class="l"><span class="pill pos" style="font-size:9px">' + esc(a.kind === 'pick' ? 'PK' : a.rawPos || a.pos) + '</span>' +
    '<span class="nm">' + esc(a.name) + '</span></span><span class="v">' + fmt(a.value) + '</span></div>').join('') + '</div>';

  const opts = DATA.teams.filter(x => x.roster_id !== ME).map(x =>
    '<option value="' + x.roster_id + '"' + (x.roster_id === t.cp ? ' selected' : '') + '>' + esc(x.owner_name + ' — ' + x.team_name) + '</option>').join('');

  const saved = DATA.scenarios.concat([]).map(sc => {
    const a = J(sc.side_a_assets), b = J(sc.side_b_assets);
    return '<details class="det"><summary><span>' + esc(sc.name) + '</span><span class="tag">' + esc(sc.status || '') + '</span></summary><div class="inner">' +
      '<div style="margin-bottom:6px"><span class="tag">Out</span> ' + esc(a.map(x => x.name).join(', ') || '—') + ' · <span class="num">' + fmt(sc.side_a_value) + '</span></div>' +
      '<div style="margin-bottom:6px"><span class="tag">In</span> ' + esc(b.map(x => x.name).join(', ') || '—') + ' · <span class="num">' + fmt(sc.side_b_value) + '</span></div>' +
      esc(sc.notes || '') + '</div></details>';
  }).join('');

  const offers = DATA.offers.map(o => {
    const rs = J(o.reasoning);
    return '<details class="det"><summary><span>' + esc(o.label) + '</span><span class="tag" style="color:' + (o.verdict === 'accept' ? 'var(--jade)' : 'var(--gold)') + '">' + esc(o.verdict) + ' · ' + n(o.verdict_score) + '</span></summary><div class="inner">' +
      '<div style="margin-bottom:6px"><span class="tag">Give</span> ' + esc(J(o.giving_assets).map(x => x.name).join(', ')) + '</div>' +
      '<div style="margin-bottom:8px"><span class="tag">Get</span> ' + esc(J(o.receiving_assets).map(x => x.name).join(', ')) + '</div>' +
      rs.map(r => '<div style="margin-bottom:5px;padding-left:10px;border-left:2px solid ' + (r.tone === 'positive' ? 'var(--jade)' : r.tone === 'negative' ? 'var(--crimson)' : 'var(--line2)') + '"><strong style="color:var(--parch);font-weight:500">' + esc(r.label) + '</strong> — ' + esc(r.detail) + '</div>').join('') +
      '</div></details>';
  }).join('');

  return head('Trade Lab', 'Pick a counterparty, stack both pans, and watch the beam. Values are dynasty market values; picks are priced off the league pick chart.') +
    '<div class="lab">' +
    '<div class="card"><h3>You send · ' + MY.team_name + '</h3>' +
    '<input type="text" id="qA" placeholder="Filter your assets…" value="' + esc(t.qA) + '" style="width:100%;margin-bottom:8px">' + list(mine, 'A', t.qA) + '</div>' +

    '<div class="card" style="position:sticky;top:14px">' +
    '<div class="scale"><svg viewBox="0 0 260 150" width="100%" height="140" aria-hidden="true">' +
    '<line x1="130" y1="26" x2="130" y2="132" stroke="var(--line2)" stroke-width="3"/>' +
    '<path d="M104 132 H156" stroke="var(--line2)" stroke-width="4" stroke-linecap="round"/>' +
    '<g transform="rotate(' + tilt + ' 130 26)" style="transition:transform .35s ease">' +
    '<line x1="34" y1="26" x2="226" y2="26" stroke="var(--gold)" stroke-width="3" stroke-linecap="round"/>' +
    '<circle cx="130" cy="26" r="5" fill="var(--gold)"/>' +
    '<line x1="34" y1="26" x2="34" y2="62" stroke="var(--line2)" stroke-width="1.5"/>' +
    '<path d="M8 62 H60 L48 92 H20 Z" fill="rgba(199,68,58,.14)" stroke="var(--crimson)" stroke-width="1.5"/>' +
    '<text x="34" y="82" text-anchor="middle" font-family="IBM Plex Mono" font-size="13" fill="var(--parch)">' + fmt(gv) + '</text>' +
    '<line x1="226" y1="26" x2="226" y2="62" stroke="var(--line2)" stroke-width="1.5"/>' +
    '<path d="M200 62 H252 L240 92 H212 Z" fill="rgba(79,169,139,.14)" stroke="var(--jade)" stroke-width="1.5"/>' +
    '<text x="226" y="82" text-anchor="middle" font-family="IBM Plex Mono" font-size="13" fill="var(--parch)">' + fmt(rv) + '</text>' +
    '</g></svg>' +
    '<div class="verdict" style="color:' + vcol + '">' + verdict + '</div>' +
    '<div class="readout">' + (live ? (delta >= 0 ? '+' : '') + fmt(delta) + ' net · ' + (pct * 100).toFixed(1) + '%<br>' + give.length + ' out / ' + get.length + ' in' : 'Select assets on either side') + '</div>' +
    '<button class="chip" id="clr" style="margin-top:10px">Clear both sides</button>' +
    '</div>' +
    (notes.length ? '<div class="notes">' + notes.map(x => '<div class="' + x.c + '"><strong style="font-weight:500">' + esc(x.t) + '</strong> — <span class="muted">' + esc(x.d) + '</span></div>').join('') + '</div>' : '') +
    '</div>' +

    '<div class="card"><h3>You receive · <select id="cp" style="font-family:var(--body);font-size:12px;padding:3px 6px">' + opts + '</select></h3>' +
    '<input type="text" id="qB" placeholder="Filter their assets…" value="' + esc(t.qB) + '" style="width:100%;margin-bottom:8px">' + list(theirs, 'B', t.qB) + '</div>' +
    '</div>' +

    '<div class="grid" style="grid-template-columns:1fr 1fr;margin-top:14px;align-items:start">' +
    '<div class="card"><h3>Logged scenarios · ' + DATA.scenarios.length + '</h3>' + (saved || '<div class="empty">None logged.</div>') + '</div>' +
    '<div class="card"><h3>Offers on the table · ' + DATA.offers.length + '</h3>' + (offers || '<div class="empty">No live offers.</div>') + '</div>' +
    '</div>';
}

/* ================= 04 league ================= */
function leagueView() {
  const max = teamTotals[0].total;
  const rows = teamTotals.map(t => {
    const seg = POS_ORDER.map(p => t.byPos[p]).concat([t.capital]);
    const cols = ['#E0722F', '#D9A441', '#4FA98B', '#8C7BB8', '#5B8FB9', '#B96A6A', '#7A9A6E', '#4A5F59'];
    const tot = seg.reduce((a, b) => a + b, 0) || 1;
    const stack = '<span style="display:flex;height:5px;border-radius:3px;overflow:hidden;background:var(--line)">' +
      seg.map((v, i) => '<i style="width:' + (v / tot * 100) + '%;background:' + cols[i] + '"></i>').join('') + '</span>';
    const open = state.league.open === t.roster_id;
    const ros = assetsCache[t.roster_id].players.slice().sort((a, b) => b.value - a.value);
    return '<div class="teamrow' + (t.roster_id === ME ? ' me' : '') + '" data-rid="' + t.roster_id + '">' +
      '<span class="rk">' + t.rank + '</span>' +
      '<span><span class="tn">' + esc(t.team_name) + (t.roster_id === ME ? ' <span class="pill trade">you</span>' : '') + '</span><br><span class="on">' + esc(t.owner_name) + ' · $' + t.faab_remaining + ' FAAB · ' + t.count + ' players</span>' +
      '<div style="margin-top:6px;width:100%;max-width:420px">' + stack + '</div></span>' +
      '<span class="num muted" style="font-size:11.5px">' + fmt(t.capital) + '<br><span class="tag">picks</span></span>' +
      '<span class="num" style="color:var(--gold);font-size:15px">' + fmt(t.total) + '<br><span class="tag" style="color:var(--muted)">' + Math.round(t.total / max * 100) + '% of top</span></span>' +
      '</div>' +
      (open ? '<div style="padding:10px 14px 16px;background:var(--panel2);border-bottom:1px solid var(--line)">' +
        '<div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:4px 14px">' +
        ros.map(p => '<div style="display:flex;justify-content:space-between;gap:8px;font-size:12.5px;padding:2px 0">' +
          '<span><span class="tag" style="display:inline-block;width:26px">' + esc(p.rawPos) + '</span>' + esc(p.name) + '</span><span class="num muted">' + fmt(p.value) + '</span></div>').join('') +
        '</div></div>' : '');
  }).join('');

  const legend = POS_ORDER.concat(['Picks']).map((p, i) => {
    const cols = ['#E0722F', '#D9A441', '#4FA98B', '#8C7BB8', '#5B8FB9', '#B96A6A', '#7A9A6E', '#4A5F59'];
    return '<span class="tag" style="margin-right:12px"><i style="display:inline-block;width:8px;height:8px;background:' + cols[i] + ';border-radius:1px;margin-right:5px"></i>' + p + '</span>';
  }).join('');

  return head('League', 'All ' + DATA.teams.length + ' franchises ranked by roster plus draft capital. Click any team to open its roster.') +
    '<div class="card" style="margin-bottom:14px"><h3>Value composition</h3><div>' + legend + '</div></div>' +
    '<div class="card" style="padding:0">' + rows + '</div>';
}

/* ================= 05 waivers ================= */
function waiverView() {
  const s = state.waiver;
  const rows = DATA.waivers.filter(w => (s.pri === 'ALL' || w.priority === s.pri) && (s.status === 'ALL' || w.status === s.status));
  const priCol = p => p === 'high' ? 'var(--crimson)' : p === 'medium' ? 'var(--gold)' : 'var(--muted)';
  const priRank = { high: 0, medium: 1, low: 2 };
  rows.sort((a, b) => (priRank[a.priority] ?? 3) - (priRank[b.priority] ?? 3));
  const prios = [...new Set(DATA.waivers.map(w => w.priority))].filter(Boolean);
  const stats = [...new Set(DATA.waivers.map(w => w.status))].filter(Boolean);

  return head('Waiver Board', 'Targets already scouted, ranked by priority. You have $' + MY.faab_remaining + ' of FAAB left — ' +
    (teamTotals.filter(t => t.faab_remaining > MY.faab_remaining).length + 1) + 'th most in the league.') +
    '<div class="controls">' +
    '<span class="tag" style="margin-right:4px">Priority</span>' +
    ['ALL'].concat(prios).map(p => '<button class="chip' + (s.pri === p ? ' on' : '') + '" data-pri="' + p + '">' + p + '</button>').join('') +
    '<span class="tag" style="margin:0 4px 0 12px">Status</span>' +
    ['ALL'].concat(stats).map(p => '<button class="chip' + (s.status === p ? ' on' : '') + '" data-st="' + p + '">' + esc(p) + '</button>').join('') +
    '<span class="muted mono" style="font-size:11px;margin-left:auto">' + rows.length + ' targets</span></div>' +
    '<div class="grid" style="grid-template-columns:repeat(auto-fill,minmax(320px,1fr))">' +
    (rows.length ? rows.map(w => '<div class="card">' +
      '<div style="display:flex;justify-content:space-between;gap:8px;align-items:flex-start">' +
      '<div><div style="font-family:var(--disp);font-size:18px;font-weight:600">' + esc(w.player_name) + '</div>' +
      '<div class="tag" style="margin-top:3px">' + esc(w.position) + (w.nfl_team ? ' · ' + esc(w.nfl_team) : '') + ' · ' + esc(w.target_type) + (+w.is_rookie ? ' · rookie' : '') + '</div></div>' +
      '<span class="pill" style="border-color:' + priCol(w.priority) + ';color:' + priCol(w.priority) + '">' + esc(w.priority) + '</span></div>' +
      '<div style="font-size:12.5px;margin-top:10px">' + esc(w.rationale) + '</div>' +
      '<div style="font-size:12.5px;margin-top:8px;padding-left:10px;border-left:2px solid var(--line2)" class="muted">' + esc(w.roster_fit_note || '') + '</div>' +
      '<div class="tag" style="margin-top:10px">' + esc(w.status) + '</div></div>').join('')
      : '<div class="empty">No targets match.</div>') + '</div>';
}

/* ================= 06 draft capital ================= */
function picksView() {
  const seasons = [...new Set(DATA.picks.map(p => p.season))].sort();
  const s = state.picks.season === 'ALL' ? seasons : [state.picks.season];
  const held = DATA.picks.filter(p => p.current_owner_roster_id === ME);
  const gone = DATA.picks.filter(p => p.original_roster_id === ME && p.current_owner_roster_id !== ME);
  const inVal = held.reduce((a, p) => a + pickValue(p.season, p.round), 0);
  const outVal = gone.reduce((a, p) => a + pickValue(p.season, p.round), 0);
  const acq = held.filter(p => p.original_roster_id !== ME);

  const blocks = s.map(season => {
    const mine = held.filter(p => p.season === season).sort((a, b) => a.round - b.round || a.original_roster_id - b.original_roster_id);
    const lost = gone.filter(p => p.season === season).sort((a, b) => a.round - b.round);
    const cards = mine.map(p => '<div class="pick own"><div class="s">' + p.season + '</div><div class="r">' + ord(p.round) + '</div>' +
      '<div class="v">' + fmt(pickValue(p.season, p.round)) + '</div><div class="o">' +
      (p.original_roster_id === ME ? 'own' : 'from ' + esc(teamByRoster[p.original_roster_id].owner_name)) + '</div></div>')
      .concat(lost.map(p => '<div class="pick gone"><div class="s">' + p.season + '</div><div class="r">' + ord(p.round) + '</div>' +
        '<div class="v">' + fmt(pickValue(p.season, p.round)) + '</div><div class="o">traded to ' + esc(teamByRoster[p.current_owner_roster_id].owner_name) + '</div></div>')).join('');
    const sv = mine.reduce((a, p) => a + pickValue(p.season, p.round), 0);
    return '<div class="card" style="margin-bottom:14px"><h3>' + season + ' · ' + mine.length + ' held · ' + fmt(sv) + ' value</h3><div class="pickgrid">' + cards + '</div></div>';
  }).join('');

  const chart = DATA.pickValues.slice().sort((a, b) => a.round - b.round || a.season - b.season).map(p =>
    '<tr><td class="num">' + p.season + '</td><td>' + ord(p.round) + '</td><td class="num" style="color:var(--gold)">' + fmt(p.value) + '</td></tr>').join('');

  return head('Draft Capital', 'Picks you hold, picks you have spent, and what the league chart says each is worth.') +
    '<div class="grid kpis" style="margin-bottom:14px">' +
    kpi(String(held.length), 'Picks held', fmt(inVal) + ' combined value', 'neut') +
    kpi(String(acq.length), 'Acquired from rivals', fmt(acq.reduce((a, p) => a + pickValue(p.season, p.round), 0)) + ' of that total', 'up') +
    kpi(String(gone.length), 'Native picks traded away', fmt(outVal) + ' shipped out', 'down') +
    kpi(ord([...teamTotals].sort((a, b) => b.capital - a.capital).findIndex(t => t.roster_id === ME) + 1), 'Capital rank', 'of ' + DATA.teams.length + ' franchises', 'neut') +
    '</div>' +
    '<div class="controls"><span class="tag" style="margin-right:4px">Season</span>' +
    ['ALL'].concat(seasons).map(x => '<button class="chip' + (String(state.picks.season) === String(x) ? ' on' : '') + '" data-se="' + x + '">' + x + '</button>').join('') + '</div>' +
    blocks +
    '<div class="grid" style="grid-template-columns:1fr 1fr;align-items:start">' +
    '<div class="card"><h3>Pick value chart</h3><table><thead><tr><th class="num">Season</th><th>Round</th><th class="num">Value</th></tr></thead><tbody>' + chart + '</tbody></table></div>' +
    '<div class="card"><h3>Trade history on native picks</h3>' +
    DATA.legacyPicks.map(p => '<details class="det"><summary><span>' + p.season + ' ' + esc(p.round) + '</span><span class="tag">' + esc(String(p.current_owner).split('(')[0]) + '</span></summary><div class="inner">' + esc(p.note) + '</div></details>').join('') +
    '</div></div>';
}

/* ================= 07 rookies ================= */
function rookieView() {
  const s = state.rookies;
  let rows = DATA.rookieRanks.filter(r => r.unit === s.unit && (!s.fa || +r.is_free_agent === 1) &&
    (!s.q || (r.player_name + ' ' + (r.nfl_team || '') + ' ' + (r.position_rank || '')).toLowerCase().includes(s.q.toLowerCase())));
  rows.sort((a, b) => { const A = a[s.sort], B = b[s.sort]; return (typeof A === 'string' ? String(A).localeCompare(String(B)) : n(A) - n(B)) * s.dir; });
  const th = (k, l, num) => '<th data-k="' + k + '" class="' + (num ? 'num' : '') + '">' + l + (s.sort === k ? ' <span class="arw">' + (s.dir === 1 ? '▲' : '▼') + '</span>' : '') + '</th>';
  const score = v => { const x = n(v); const c = x >= 4.5 ? 'var(--jade)' : x >= 3.5 ? 'var(--gold)' : x >= 2.5 ? 'var(--muted)' : 'var(--crimson)'; return '<span class="num" style="color:' + c + '">' + (v == null ? '—' : x.toFixed(1)) + '</span>'; };

  const fits = DATA.prospects.filter(p => p.need_fit).sort((a, b) => n(a.consensus_rank) - n(b.consensus_rank));

  return head('Rookie Board', DATA.rookieRanks.length + ' ranked rookies and ' + DATA.prospects.length + ' scouted prospects. Bust score is inverted — higher is safer.') +
    '<div class="controls">' +
    ['offense', 'defense'].map(u => '<button class="chip' + (s.unit === u ? ' on' : '') + '" data-unit="' + u + '">' + u + '</button>').join('') +
    '<button class="chip' + (s.fa ? ' on' : '') + '" id="fa">Free agents only</button>' +
    '<input type="text" id="rq" placeholder="Search rookie…" value="' + esc(s.q) + '" style="min-width:200px">' +
    '<span class="muted mono" style="font-size:11px;margin-left:auto">' + rows.length + ' shown</span></div>' +
    '<div class="tblwrap" style="margin-bottom:14px"><table><thead><tr>' +
    th('rank', '#', 1) + th('player_name', 'Player') + th('position_rank', 'Pos') + th('nfl_team', 'NFL') +
    th('age', 'Age', 1) + th('tier', 'Tier', 1) + th('overall_score', 'Overall', 1) + th('upside_score', 'Upside', 1) +
    th('bust_score', 'Safety', 1) + th('ecr_vs_adp', 'ECR−ADP', 1) + '</tr></thead><tbody>' +
    (rows.length ? rows.map(r => '<tr><td class="num muted">' + n(r.rank) + '</td><td>' + esc(r.player_name) +
      (+r.is_free_agent === 1 ? ' <span class="pill trade">FA</span>' : '') + '</td>' +
      '<td><span class="pill pos">' + esc(r.position_rank) + '</span></td><td class="muted">' + esc(r.nfl_team || '—') + '</td>' +
      '<td class="num">' + (r.age ? n(r.age) : '—') + '</td><td class="num">' + n(r.tier) + '</td>' +
      '<td class="num">' + score(r.overall_score) + '</td><td class="num">' + score(r.upside_score) + '</td>' +
      '<td class="num">' + score(r.bust_score) + '</td>' +
      '<td class="num muted">' + (r.ecr_vs_adp == null ? '—' : (n(r.ecr_vs_adp) > 0 ? '+' : '') + n(r.ecr_vs_adp)) + '</td></tr>').join('')
      : '<tr><td colspan="10" class="empty">No rookies match.</td></tr>') + '</tbody></table></div>' +
    '<div class="card"><h3>Prospects flagged as a fit for this roster · ' + fits.length + '</h3>' +
    (fits.length ? fits.map(p => '<details class="det"><summary><span>' + esc(p.name) + ' <span class="tag">' + esc(p.position) + ' · ' + esc(p.college || '') + '</span></span><span class="tag">#' + n(p.consensus_rank) + ' · tier ' + n(p.tier) + '</span></summary>' +
      '<div class="inner">' + esc(p.dynasty_note || '') + '<div style="margin-top:6px;color:var(--gold)">Fit: ' + esc(p.need_fit) + '</div></div></details>').join('')
      : '<div class="empty">No prospects tagged with a roster fit.</div>') + '</div>';
}

/* ================= wiring ================= */
const wire = {
  war() { },
  roster() {
    const q = document.getElementById('q');
    q.oninput = () => { state.roster.q = q.value; const p = q.selectionStart; render(); const e = document.getElementById('q'); e.focus(); e.setSelectionRange(p, p); };
    document.querySelectorAll('[data-pos]').forEach(b => b.onclick = () => { state.roster.pos = b.dataset.pos; render(); });
    document.getElementById('stf').onchange = e => { state.roster.status = e.target.value; render(); };
    document.querySelectorAll('th[data-k]').forEach(h => h.onclick = () => {
      const k = h.dataset.k; if (state.roster.sort === k) state.roster.dir *= -1; else { state.roster.sort = k; state.roster.dir = (k === 'name' || k === 'team' || k === 'pos') ? 1 : -1; } render();
    });
    document.querySelectorAll('tr.rw').forEach(r => r.onclick = () => {
      const nt = document.querySelector('tr.note[data-for="' + r.dataset.nm.replace(/"/g, '\\"') + '"]');
      if (nt) nt.style.display = nt.style.display === 'none' ? 'table-row' : 'none';
    });
  },
  trade() {
    document.getElementById('cp').onchange = e => { state.trade.cp = +e.target.value; state.trade.get = new Set(); render(); };
    document.getElementById('clr').onclick = () => { state.trade.give = new Set(); state.trade.get = new Set(); render(); };
    ['qA', 'qB'].forEach(id => { const el = document.getElementById(id); el.oninput = () => { state.trade[id] = el.value; const p = el.selectionStart; render(); const e2 = document.getElementById(id); e2.focus(); e2.setSelectionRange(p, p); }; });
    document.querySelectorAll('.asset').forEach(a => a.onclick = () => {
      const set = a.dataset.side === 'A' ? state.trade.give : state.trade.get;
      set.has(a.dataset.key) ? set.delete(a.dataset.key) : set.add(a.dataset.key); render();
    });
  },
  league() {
    document.querySelectorAll('.teamrow').forEach(r => r.onclick = () => {
      state.league.open = state.league.open === +r.dataset.rid ? null : +r.dataset.rid; render();
    });
  },
  waiver() {
    document.querySelectorAll('[data-pri]').forEach(b => b.onclick = () => { state.waiver.pri = b.dataset.pri; render(); });
    document.querySelectorAll('[data-st]').forEach(b => b.onclick = () => { state.waiver.status = b.dataset.st; render(); });
  },
  picks() { document.querySelectorAll('[data-se]').forEach(b => b.onclick = () => { state.picks.season = b.dataset.se === 'ALL' ? 'ALL' : +b.dataset.se; render(); }); },
  rookies() {
    document.querySelectorAll('[data-unit]').forEach(b => b.onclick = () => { state.rookies.unit = b.dataset.unit; render(); });
    document.getElementById('fa').onclick = () => { state.rookies.fa = !state.rookies.fa; render(); };
    const q = document.getElementById('rq');
    q.oninput = () => { state.rookies.q = q.value; const p = q.selectionStart; render(); const e = document.getElementById('rq'); e.focus(); e.setSelectionRange(p, p); };
    document.querySelectorAll('th[data-k]').forEach(h => h.onclick = () => {
      const k = h.dataset.k; if (state.rookies.sort === k) state.rookies.dir *= -1; else { state.rookies.sort = k; state.rookies.dir = ['player_name', 'nfl_team', 'position_rank'].includes(k) ? 1 : -1; } render();
    });
  }
};
render();
</script>
</body>
</html>
